# On every push and PR: the example script runs headless on lib/norns.lua (Lua 5.4, the
# browser's version, and 5.3, norns'), and build.mjs makes a static copy of it.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Headless run on Lua 5.4 and 5.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 lua5.3
          lua5.4 test/headless.lua test/hello
          lua5.3 test/headless.lua test/hello

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static build
        run: |
          node build.mjs test/hello _site
          test -f _site/index.html && test -f _site/files.json && test -f _site/vendor/wasmoon/glue.wasm
